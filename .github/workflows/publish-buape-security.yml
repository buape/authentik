name: Publish Buape Security Image

on:
  push:
    branches: [buape]
    paths:
      - lifecycle/container/Dockerfile
      - Cargo.toml
      - Cargo.lock
      - uv.lock
      - .github/workflows/publish-buape-security.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: lifecycle/container/Dockerfile
          platforms: linux/amd64,linux/arm64
          pull: true
          no-cache: true
          push: true
          tags: |
            ghcr.io/buape/authentik-server:2026.5.3-ca-20261022
            ghcr.io/buape/authentik-server:sha-${{ github.sha }}
          build-args: |
            VERSION=2026.5.3
            GIT_BUILD_HASH=${{ github.sha }}
